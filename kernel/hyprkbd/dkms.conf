PACKAGE_NAME="hyprkbd"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="hyprkbd"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
# Built with the same toolchain the running kernel was: CachyOS and other
# Clang-built kernels reject a GCC-built module with a vermagic mismatch.
MAKE[0]="grep -iq clang /proc/version && make LLVM=1 -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules || make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"
